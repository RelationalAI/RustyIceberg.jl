[package]
name = "iceberg_rust_ffi"
version = "0.9.3"
edition = "2021"

[lib]
name = "iceberg_rust_ffi"
crate-type = ["cdylib"]

[features]
default = ["julia"]
julia = []

[dependencies]
# TODO: rev points at the unmerged gb/adls-anonymous-access branch
# (RelationalAI/iceberg-rust#79), for local verification of the
# adls.allow-anonymous fix this PR's new test exercises. Bump to the actual
# merge commit on main once #79 lands.
iceberg = { git = "https://github.com/RelationalAI/iceberg-rust.git", rev = "8d2a2a3aa6bd7f4200a4fb61bfe7124a3434b8bc", features = ["storage-azdls"] }
iceberg-catalog-rest = { git = "https://github.com/RelationalAI/iceberg-rust.git", rev = "8d2a2a3aa6bd7f4200a4fb61bfe7124a3434b8bc" }
object_store_ffi = { git = "https://github.com/RelationalAI/object_store_ffi", rev = "bbbbd2f0ab0d609416014cef0d124efa99a515f3", default-features = false }
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
libc = "0.2"
anyhow = "1.0"
arrow-array = { version = "58.1", features = ["ffi"] }
arrow-buffer = "58.1"
arrow-cast = "58.1"
arrow-ipc = "58.1"
arrow-schema = "58.1"
parquet = "58.1"
tracing-subscriber = "0.3"
tracing = "0.1"
once_cell = "1.19"
async-trait = "0.1"
# Pin home to 0.5.9 to support rustc < 1.88
# (0.5.11+ requires rustc 1.88+)
home = "=0.5.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.142"
strum = { version = "0.26", features = ["derive"] }

[dev-dependencies]
bytes = "1"
tempfile = "3.0"
