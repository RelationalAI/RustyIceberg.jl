[package]
name = "iceberg_rust_ffi"
version = "0.9.7"
edition = "2021"

[lib]
name = "iceberg_rust_ffi"
crate-type = ["cdylib"]

[features]
default = ["julia"]
julia = []

[dependencies]
# Pinned to RelationalAI/iceberg-rust#83 (gb/base-snapshot-assertion-and-stage-commit,
# rebased onto main after #84 merged), which adds OverwriteAction::assert_requirements.
# Move this back to a `main` rev once that PR merges.
iceberg = { git = "https://github.com/RelationalAI/iceberg-rust.git", rev = "f02c8db2f890d4447a2995738668573769aa98a3" }
iceberg-catalog-rest = { git = "https://github.com/RelationalAI/iceberg-rust.git", rev = "f02c8db2f890d4447a2995738668573769aa98a3" }
iceberg-storage-opendal = { git = "https://github.com/RelationalAI/iceberg-rust.git", rev = "f02c8db2f890d4447a2995738668573769aa98a3", features = ["opendal-azdls"] }
iceberg-storage-refreshable = { git = "https://github.com/RelationalAI/iceberg-rust.git", rev = "f02c8db2f890d4447a2995738668573769aa98a3" }
object_store_ffi = { git = "https://github.com/RelationalAI/object_store_ffi", rev = "bbbbd2f0ab0d609416014cef0d124efa99a515f3", default-features = false }
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
libc = "0.2"
anyhow = "1.0"
arrow-array = { version = "59.2", features = ["ffi"] }
arrow-buffer = "59.2"
arrow-cast = "59.2"
arrow-ipc = "59.2"
arrow-schema = "59.2"
parquet = "59.2"
tracing-subscriber = "0.3"
tracing = "0.1"
once_cell = "1.19"
async-trait = "0.1"
# Pin home to 0.5.9 to support rustc < 1.88
# (0.5.11+ requires rustc 1.88+)
home = "=0.5.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.142"
strum = { version = "0.26", features = ["derive"] }

[dev-dependencies]
bytes = "1"
tempfile = "3.0"
